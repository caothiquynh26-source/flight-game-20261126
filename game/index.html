<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Meridian Run — an original valley flight game: take off, thread five rings, land before the fuel runs out.">
<title>Meridian Run — a valley flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d141c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Meridian Run: fly the valley course, thread five rings, and land back on the home strip"></canvas>
<noscript><p style="color:#eaf6ff;font:16px system-ui,sans-serif;text-align:center;padding:2em">Meridian Run needs JavaScript to fly.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
